spring.application.name=alumnos

# MySQL 8 en Docker (contenedor mysql-alumnos, puerto 3306)
spring.datasource.url=jdbc:mysql://localhost:3306/alumnosdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA crea/actualiza la tabla alumno a partir de la entidad
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
